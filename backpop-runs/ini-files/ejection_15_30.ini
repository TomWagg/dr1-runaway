; Search for DR1 assuming that it gained 15 km/s purely from an ejection

[backpop]
n_threads = 96
n_eff = 15000
n_live = 4000
verbose = True
output_folder = /mnt/home/twagg/ceph/dr1/ejection_15_30
resume = True
phase_condition = (sep < 0) & (kstar_2 in [1,7,8]) & (teff_2 > 100000) & (vsys_2_total > 15) & (vsys_2_total < 30)
use_bcm = True
bpp_columns =
bcm_columns =
n_bpp_rows =

; Observational constraints

[backpop.obs::lum_2]
mean = 5.68
sigma = 0.01
log = True
out_name = lum_2

[backpop.fixed::metallicity]
value = 0.00284

; Always evolve for 100 Myr, this covers all possible ages
[backpop.fixed::tphys]
value = 100

; Prior info on parameters to vary
; Primary needs to explode so m1 > 7
[backpop.var::m1]
min = 7.0
max = 150.0


; Secondary needs to be the observed star, so m2 > 5 conservatively
[backpop.var::m2]
min = 5.0
max = 40.0

; Orbital period, assume flat in log in Sana/deMink range
[backpop.var::tb]
min = 0.15
max = 5.5
log = True

; pretty uniform, just not super eccentric for convergence
[backpop.var::e]
min = 0.0
max = 0.9

; kicks are uniform simple priors
[backpop.var::vk1]
min = 0.0
max = 1200.0

[backpop.var::phi1]
min = -90.0
max = 90.0

[backpop.var::theta1]
min = 0.0
max = 360.0

[backpop.var::omega1]
min = 0.0
max = 360.0

; Default binary physics settings to use in COSMIC
[bse]

